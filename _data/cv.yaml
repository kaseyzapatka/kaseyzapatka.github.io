        end_date: 2010-05
        location: San Diego, CA

    selected projects:
      - name: NEPA Clean Energy Environmental Review Analysis
        date: '2026–present'
        highlights:
          - Trained BERT classifiers and LLM adjudication layer to extract review dates and
            process types from 120,000+ unstructured federal documents
          - Integrated Federal Register API, web scraping, and ML/regex classifiers to
            categorize 20,000+ projects by technology, capacity, and review type
          - 'Results: [project website](https://www.kaseyzapatka.com/nepa/phase1/reports/project_overview.html),
            [HuggingFace document browser](https://huggingface.co/spaces/kaseyzapatka/nepa-document-explorer)'

      - name: Voter Turnout in New York City
        date: '2025–2026'
        highlights:
          - Used Bayesian Improved Surname Geocoding (BISG) to impute race/ethnicity from
            surnames in 4.6 million NYC voter registration records
          - Applied multilevel regression and poststratification (MrP) to impute educational
            attainment and build survey post-stratification weights
          - Applied RAG techniques and fine-tuned open-source LLMs to extract insights from
            voter file records

      - name: SF Residential Inspection Risk
        date: '2025'
        highlights:
          - Linked fire incidents, building violations, inspection records, and parcel tax
            data at the parcel level using APN identifiers
          - Built composite risk scores and k-means spatial clusters to prioritize inspections
            for SFFD and the Department of Building Inspection
          - 'Deployed two interactive Shiny dashboards: [SFFD](https://kaseyzapatka.shinyapps.io/fire_risk_dashboard/),
            [DBI](https://kaseyzapatka.shinyapps.io/dbi_risk_dashboard/)'

      - name: Superdiversity in Metro New York
        date: '2020–2021'
        highlights:
          - Built 6 cross-sectional longitudinal databases and led end-to-end development
            of interactive [website and teaching tool](https://www.superdiv-newyork.mmg.mpg.de)

      - name: Housing Literacy
        date: '2017–2019'
        highlights:
          - Developed [online tool](https://housingliteracynyc.org) annotating NYC rent
            regulation legal documents for rent-stabilized tenants and housing advocates

