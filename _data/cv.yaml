  sections:
    summary:
      - Social science researcher using computational and survey methods to measure
        policy impacts and visualize findings for stakeholders and decision-makers.

    experience:
      - company: Clean Air Task Force
        position: Consultant – NEPA Clean Energy Review Analysis
        location: Remote
        start_date: 2026-01
        end_date: present
        highlights:
          - Built a BERT+LLM pipeline to extract and classify records from 120,000+
            NEPA documents, enabling CATF to analyze clean energy review timelines at scale
          - Integrated Federal Register API data, targeted web scraping, and ML/regex
            classifiers to categorize 20,000+ projects by technology, review process, and capacity
          - Scoped research questions collaboratively with CATF and delivered phased findings
            across six structured deliverables mapped to specific policy priorities
          - 'Published findings via public [project website](https://www.kaseyzapatka.com/nepa/phase1/reports/project_overview.html)
            and [HuggingFace document browser](https://huggingface.co/spaces/kaseyzapatka/nepa-document-explorer)'

      - company: University of California, Berkeley
        position: Postdoctoral Researcher and Lecturer
        location: Berkeley, CA
        start_date: 2023-07
        end_date: present
        highlights:
          - Lead cross-functional research team to develop, maintain, and analyze eviction
            database (150M+ records) using SQL
          - Applied R-based machine learning, multilevel regression, and synthetic control
            methods to study impact of rental assistance on eviction filings
          - Coordinated with UPenn partners, managed research process, and led report writing
          - Presented findings and strategic recommendations to federal housing policy stakeholders
          - Taught machine learning, natural language processing, and causal inference to PhD students
          - Led 32 weekly labs in R and Python libraries (tidyverse, sklearn, TensorFlow)
          - Supervised 8 student projects on predictive modeling and decision-making

      - company: NYC Department of Housing Preservation & Development
        position: Data Scientist
        location: New York City, NY
        start_date: 2022-09
        end_date: 2023-06
        highlights:
          - Collaborated with US Census research team to establish sample survey research
            frame for Housing Vacancy Survey
          - Addressed Housing Vacancy Survey measurement error by creating post-stratification weights
          - Developed methodology with survey weights to determine where to build affordable
            housing, presented to non-technical stakeholders, and persuaded Commissioner to adopt methodology

      - company: City University of New York, The Graduate Center
        position: Research Scientist, Professor Van Tran
        location: New York City, NY
        start_date: 2021-01
        end_date: 2022-12
        highlights:
          - Built US Census dataset to study ethno-racial neighborhood integration in metro New York
          - Fitted multinomial logistic regression models and interpreted marginal effects plots in R
          - Wrote methodological sections, created descriptive plots in R, and managed project
            development on GitHub

      - company: City University of New York, The Graduate Center
        position: Research Scientist, Professor Paul Attewell
        location: New York City, NY
        start_date: 2018-10
        end_date: 2021-05
        highlights:
          - Developed research projects to study divergence of benefits for groups with different
            educational attainment
          - Managed 4 large national, longitudinal, and cross-sectional datasets used in analyses
          - Used data mining, HLM, OLS, and logistic regression techniques to understand the impact
            of educational attainment on mid-life labor market earnings

      - company: CUNY, Center for Urban Research
        position: UX Researcher
        location: New York City, NY
        start_date: 2016-09
        end_date: 2019-01
        highlights:
          - Designed, executed, and led focus group research to identify key labor market trends
            across 10 different projects
          - Distilled findings into actionable insights and presented recommendations to clients

      - company: Empirical Creative
        position: UX Researcher
        location: New York City, NY
        start_date: 2014-11
        end_date: 2016-08
        highlights:
          - Designed and led mock jury trials (focus groups) to identify favorable juror characteristics
            and attitudes
          - Conducted strategic research to understand user characteristics that shape case opinions
            and what facts change decisions
          - Translated insights into actionable recommendations — trial strategy, user profiles,
            and visual graphics

      - company: Max Planck Institute
        position: Data Scientist – Superdiversity in Metro New York Project
        location: Remote
        start_date: 2020-01
        end_date: 2021-12
        highlights:
          - Managed end-to-end project development of interactive Superdiversity Website and Teaching Tool
          - Built and analyzed 6 cross-sectional, longitudinal databases exploring changing diversity
            in Metro New York
          - Supervised design team and ensured project aligned with stakeholder vision

